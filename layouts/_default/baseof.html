<!doctype html>
<html lang="{{ .Site.Language.Lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .Title }}{{ .Title }} · {{ end }}{{ .Site.Title }}</title>
  <style>
    :root { color-scheme: light; --verde: #176b3a; --fondo: #f5f7f2; }
    body { margin: 0; font-family: system-ui, sans-serif; background: var(--fondo); color: #183028; }
    header, main, footer { max-width: 760px; margin: auto; padding: 1.25rem; }
    header { padding-bottom: 0; }
    a { color: var(--verde); }
    article { background: white; border-radius: 14px; padding: 1.5rem; margin: 1rem 0; box-shadow: 0 3px 18px #18302810; }
  </style>
</head>
<body>
  <header><h1><a href="{{ "" | relURL }}">{{ .Site.Title }}</a></h1></header>
  <main>{{ block "main" . }}{{ end }}</main>
  <footer><small>Noticias positivas · contenido publicado automáticamente desde RSS públicos.</small></footer>
</body>
</html>
